name: CI - Cadastro de Produtos

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar e executar testes
        run: |
          javac -cp "lib/*" -d out src/main/java/com/sistemaavaliacao/cadastroproduto/model/Produto.java
