name: CI - Cadastro de Produtos

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-test:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executar testes unitários
        run: mvn test

      - name: Gerar JAR executável
        run: mvn package

      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CadastroProduto
          path: target/CadastroProduto.jar